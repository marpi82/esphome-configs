name: ESPHome Config Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate ESPHome configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Check the pinned ESPHome version is in sync
        # The two pins are updated together by Renovate; catch a partial bump.
        run: |
          workflow_version="$(grep -oP 'esphome==\K[0-9]\S*' .github/workflows/validate.yml)"
          script_version="$(grep -oP '^ESPHOME_VERSION="\K[^"]+' scripts/setup-esphome.sh)"
          echo "workflow: $workflow_version, setup script: $script_version"
          if [ "$workflow_version" != "$script_version" ]; then
            echo "::error::Pinned ESPHome version differs between .github/workflows/validate.yml ($workflow_version) and scripts/setup-esphome.sh ($script_version)"
            exit 1
          fi

      - name: Install ESPHome
        # Keep in sync with scripts/setup-esphome.sh; Renovate updates both.
        # renovate: datasource=pypi depName=esphome versioning=pep440
        run: pip install esphome==2026.7.4

      - name: Create secrets.yaml from example
        # CI-only: uses dummy placeholder values from the example file.
        # Real deployments must use a proper secrets.yaml with strong credentials.
        # ESPHome resolves `!secret` relative to each config file's directory,
        # so the file must sit next to the device configs in devices/.
        run: cp secrets.yaml.example devices/secrets.yaml

      - name: Validate all device configs
        run: |
          EXIT_CODE=0
          for config in devices/*.yaml; do
            [ -f "$config" ] || continue
            # The seeded secrets file is not a device config.
            [ "$(basename "$config")" = "secrets.yaml" ] && continue
            echo "Validating: $config"
            if out="$(esphome config "$config" 2>&1)"; then
              echo "$out"
              continue
            fi
            # A config may pin a min_version newer than the pinned ESPHome
            # (e.g. features not yet released). Warn and skip rather than fail;
            # it will be validated for real once the pinned ESPHome is bumped.
            if printf '%s\n' "$out" | grep -q "version is too old"; then
              echo "$out"
              echo "::warning file=$config::Skipping $config (requires a newer ESPHome than pinned)"
              continue
            fi
            echo "$out"
            echo "::error file=$config::Validation failed for $config"
            EXIT_CODE=1
          done
          exit $EXIT_CODE
