name: ESPHome Config Validation

on:
  push:
    branches: [main, master]
  # Every pull request is validated, whatever it targets — a PR stacked on
  # another branch is exactly the case where a broken config slips through.
  pull_request:

# The workflow only reads the repository; nothing here needs write access.
permissions:
  contents: read

# A new push supersedes the previous run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and check conventions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install yamllint
        # renovate: datasource=pypi depName=yamllint versioning=pep440
        run: pip install yamllint==1.38.0

      - name: Lint YAML
        run: yamllint --strict --format github .

      - name: Lint shell scripts
        # shellcheck is preinstalled on GitHub-hosted runners.
        run: shellcheck scripts/*.sh

      - name: Lint workflows
        # actionlint's own image, pinned by digest so the bytes that run here
        # cannot change under us, and bundling shellcheck so every `run:` block
        # is checked too. Renovate keeps the tag and the digest in step.
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: Check repository conventions
        # Label parity, ${lbl_*} coverage, !secret bookkeeping — the defects
        # `esphome config` cannot see because it only ever loads one language.
        run: python3 scripts/check-conventions.py

  validate:
    name: Validate ESPHome configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          # No requirements file: key the wheel cache on the pinned version.
          cache-dependency-path: .github/workflows/validate.yml

      - name: Check the pinned ESPHome version is in sync
        # The two pins are updated together by Renovate; catch a partial bump.
        run: |
          workflow_version="$(grep -oP 'esphome==\K[0-9]\S*' .github/workflows/validate.yml)"
          script_version="$(grep -oP '^ESPHOME_VERSION="\K[^"]+' scripts/setup-esphome.sh)"
          echo "workflow: $workflow_version, setup script: $script_version"
          if [ "$workflow_version" != "$script_version" ]; then
            echo "::error::Pinned ESPHome version differs between .github/workflows/validate.yml ($workflow_version) and scripts/setup-esphome.sh ($script_version)"
            exit 1
          fi

      - name: Install ESPHome
        # Keep in sync with scripts/setup-esphome.sh; Renovate updates both.
        # renovate: datasource=pypi depName=esphome versioning=pep440
        run: pip install esphome==2026.8.1

      - name: Create secrets.yaml from example
        # CI-only: uses dummy placeholder values from the example file.
        # Real deployments must use a proper secrets.yaml with strong credentials.
        # ESPHome resolves `!secret` relative to each config file's directory,
        # so the file must sit next to the device configs in devices/.
        run: cp secrets.yaml.example devices/secrets.yaml

      - name: Validate all device configs
        run: |
          EXIT_CODE=0
          {
            echo "### ESPHome $(esphome version | awk '{print $2}') validation"
            echo
            echo "| Config | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for config in devices/*.yaml; do
            [ -f "$config" ] || continue
            # The seeded secrets file is not a device config.
            [ "$(basename "$config")" = "secrets.yaml" ] && continue
            echo "Validating: $config"
            if out="$(esphome config "$config" 2>&1)"; then
              echo "$out"
              echo "| \`$config\` | valid |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # A config may pin a min_version newer than the pinned ESPHome
            # (e.g. features not yet released). Warn and skip rather than fail;
            # it will be validated for real once the pinned ESPHome is bumped.
            if printf '%s\n' "$out" | grep -q "version is too old"; then
              echo "$out"
              echo "::warning file=$config::Skipping $config (requires a newer ESPHome than pinned)"
              echo "| \`$config\` | skipped — needs a newer ESPHome |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            echo "$out"
            echo "::error file=$config::Validation failed for $config"
            echo "| \`$config\` | **failed** |" >> "$GITHUB_STEP_SUMMARY"
            EXIT_CODE=1
          done
          exit $EXIT_CODE
