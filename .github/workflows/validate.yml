name: ESPHome Config Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate ESPHome configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install ESPHome
        run: pip install esphome==2026.7.4

      - name: Create secrets.yaml from example
        # CI-only: uses dummy placeholder values from the example file.
        # Real deployments must use a proper secrets.yaml with strong credentials.
        # ESPHome resolves `!secret` relative to each config file's directory,
        # so the file must sit next to the device configs in devices/.
        run: cp secrets.yaml.example devices/secrets.yaml

      - name: Validate all device configs
        run: |
          EXIT_CODE=0
          for config in devices/*.yaml; do
            [ -f "$config" ] || continue
            # The seeded secrets file is not a device config.
            [ "$(basename "$config")" = "secrets.yaml" ] && continue
            echo "Validating: $config"
            if out="$(esphome config "$config" 2>&1)"; then
              echo "$out"
              continue
            fi
            # A config may pin a min_version newer than the pinned ESPHome
            # (e.g. features not yet released). Warn and skip rather than fail;
            # it will be validated for real once the pinned ESPHome is bumped.
            if printf '%s\n' "$out" | grep -q "version is too old"; then
              echo "$out"
              echo "::warning file=$config::Skipping $config (requires a newer ESPHome than pinned)"
              continue
            fi
            echo "$out"
            echo "::error file=$config::Validation failed for $config"
            EXIT_CODE=1
          done
          exit $EXIT_CODE
