# Eletechsup ES32C14 — pool heating (heat exchanger) — Polish entry.
#
# A device entry only wires things together: it sets the device identity,
# selects a language pack (labels/pl) and pulls in the shared logic and the
# common infrastructure packages. To ship the same device in another language,
# copy this file and swap the `labels` include
# (see eletechsup-es32c14-pool-heating.en.yaml).

substitutions:
  device_name: eletechsup-es32c14-pool-heating
  friendly_name: "Ogrzewanie basenu"

packages:
  labels: !include ../labels/pl/eletechsup-es32c14-pool-heating.yaml
  wifi: !include ../packages/wifi.yaml
  common: !include ../packages/common.yaml
  logic: !include ../packages/eletechsup-es32c14-pool-heating/logic.yaml
