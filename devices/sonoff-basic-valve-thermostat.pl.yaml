# Sonoff Basic — heating-valve thermostat (was Tasmota sonoff_termostat_zaworu1 /
# tasmota-termostat-zaworu at 192.168.60.22, MAC 8C:CE:4E:0C:DA:F3) — Polish entry.
#
# A device entry only wires things together: it sets the device identity,
# selects a language pack (labels/pl) and pulls in the shared logic and the
# common infrastructure packages. To ship the same device in another language,
# copy this file and swap the `labels` include
# (see sonoff-basic-valve-thermostat.en.yaml).

substitutions:
  device_name: sonoff-basic-valve-thermostat
  friendly_name: "Termostat zaworu 1"

packages:
  labels: !include ../labels/pl/sonoff-basic-valve-thermostat.yaml
  wifi: !include ../packages/wifi.yaml
  common: !include ../packages/common.yaml
  logic: !include ../packages/sonoff-basic-valve-thermostat/logic.yaml
