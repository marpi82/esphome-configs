# Zamel PNW-01 — small-lamp foot switch (was Tasmota lampa_mala_nozny / tasmota-mala
# at 192.168.60.72, MAC 5C:CF:7F:4A:CB:FB) — Polish entry.
#
# A device entry only wires things together: it sets the device identity,
# selects a language pack (labels/pl) and pulls in the shared logic and the
# common infrastructure packages. To ship the same device in another language,
# copy this file and swap the `labels` include
# (see zamel-pnw01-small-lamp.en.yaml).

substitutions:
  device_name: zamel-pnw01-small-lamp
  friendly_name: "Lampa mała — przycisk nożny"

packages:
  labels: !include ../labels/pl/zamel-pnw01.yaml
  wifi: !include ../packages/wifi.yaml
  common: !include ../packages/common.yaml
  logic: !include ../packages/zamel-pnw01/logic.yaml
