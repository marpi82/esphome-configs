# Common base configuration package.
# Usage in device config:
#   packages:
#     common: !include ../packages/common.yaml
#
# Tight flash (typical 1 MB ESP8285): still include this package, then strip
# only web_server on the entry so logger/API/OTA stay shared:
#   web_server: !remove

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password
