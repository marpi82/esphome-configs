# Common WiFi configuration package.
# Usage in device config:
#   packages:
#     wifi: !include ../packages/wifi.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    # WiFi SSID max is 32 characters; device_name is already the hostname.
    ssid: "${device_name}"
    password: !secret wifi_password_fallback

captive_portal:
