################################################################################
# Host / SDL stubs for waveshare-s3-lambda UI simulation.
# Provides the entity ids that packages/waveshare-s3-lambda/ui.yaml expects,
# with dummy values so the layout can be iterated without the ESP32-S3 board.
#
# Requires libsdl2-dev (Debian/Ubuntu). Run:
#   esphome run devices/sim/waveshare-s3-lambda.yaml
################################################################################

esphome:
  name: ${device_name}
  friendly_name: "${friendly_name}"

host:
  mac_address: "06:35:69:AB:F6:79"

logger:

# Host/SDL: use the host clock (SNTP is not available on platform host).
# Keep id sntp_time so ui.yaml can share the same clock reference as the device.
time:
  - platform: host
    id: sntp_time
    timezone: ${timezone}

display:
  - platform: sdl
    id: main_display
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      width: 1024
      height: 600

touchscreen:
  - platform: sdl
    id: main_touch
    display: main_display
    sdl_id: main_display

globals:
  - id: sim_fan_on
    type: bool
    initial_value: "true"
  - id: sim_bypass_closed
    type: bool
    initial_value: "false"
  - id: sim_phase
    type: int
    initial_value: "0"
  - id: sim_wbo_valid
    type: bool
    initial_value: "false"
  # 0=Manual, 1=Semi-manual, 2=Automatic (same as logic.yaml).
  - id: work_mode
    type: int
    initial_value: "0"

binary_sensor:
  - platform: template
    id: bin_fan
    name: "${lbl_fan}"
    device_class: running
    lambda: "return id(sim_fan_on);"

  - platform: template
    id: bin_bypass_closed
    name: "${lbl_bypass_closed}"
    lambda: "return id(sim_bypass_closed);"

  - platform: template
    id: wbo_valid
    name: "${lbl_wbo_valid}"
    lambda: "return id(sim_wbo_valid);"

sensor:
  - platform: template
    id: wbo_lambda
    name: "${lbl_wbo_lambda}"
    unit_of_measurement: "λ"
    accuracy_decimals: 3
    state_class: measurement
    update_interval: never

  - platform: template
    id: wbo_o2_pct
    name: "${lbl_wbo_o2}"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: never

  - platform: template
    id: wbo_o2_percent
    name: "${lbl_wbo_o2_percent}"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: never

  - platform: template
    id: water_temp
    name: "${lbl_water_temp}"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: exhaust_temp
    name: "${lbl_exhaust_temp}"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: supply_voltage
    name: "${lbl_supply_voltage}"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never

text_sensor:
  - platform: template
    id: wbo_status
    name: "${lbl_wbo_status}"
    update_interval: never

script:
  - id: refresh_ui_locks
    then:
      - lambda: |-
          const bool is_auto = id(work_mode) == 2;
          const bool primary_locked =
            is_auto || !id(sw_servo_primary_enable).state;
          const bool secondary_locked =
            is_auto || !id(sw_servo_secondary_enable).state;
          lv_obj_t *probe = (lv_obj_t *) id(ui_cb_probe);
          lv_obj_t *pri = (lv_obj_t *) id(ui_slider_primary);
          lv_obj_t *sec = (lv_obj_t *) id(ui_slider_secondary);
          if (probe != nullptr) {
            if (is_auto) lv_obj_add_state(probe, LV_STATE_DISABLED);
            else lv_obj_clear_state(probe, LV_STATE_DISABLED);
          }
          if (pri != nullptr) {
            if (primary_locked) lv_obj_add_state(pri, LV_STATE_DISABLED);
            else lv_obj_clear_state(pri, LV_STATE_DISABLED);
          }
          if (sec != nullptr) {
            if (secondary_locked) lv_obj_add_state(sec, LV_STATE_DISABLED);
            else lv_obj_clear_state(sec, LV_STATE_DISABLED);
          }

  - id: apply_work_mode
    mode: single
    then:
      - if:
          condition:
            lambda: return id(work_mode) == 0;
          then:
            - switch.turn_off: sw_servo_primary_enable
            - switch.turn_off: sw_servo_secondary_enable
      - if:
          condition:
            lambda: return id(work_mode) == 1;
          then:
            - switch.turn_on: sw_servo_primary_enable
            - switch.turn_on: sw_servo_secondary_enable
      - if:
          condition:
            lambda: return id(work_mode) == 2;
          then:
            - switch.turn_on: sw_servo_primary_enable
            - switch.turn_on: sw_servo_secondary_enable
            - switch.turn_on: sw_probe_heater
      - script.execute: refresh_ui_locks

select:
  - platform: template
    id: sel_work_mode
    name: "${lbl_mode}"
    optimistic: true
    restore_value: false
    options:
      - "${lbl_mode_manual}"
      - "${lbl_mode_semi}"
      - "${lbl_mode_auto}"
    initial_option: "${lbl_mode_manual}"
    set_action:
      - lambda: |-
          int m = 0;
          if (x == "${lbl_mode_semi}") m = 1;
          else if (x == "${lbl_mode_auto}") m = 2;
          id(work_mode) = m;
      - lvgl.dropdown.update:
          id: ui_dropdown_mode
          selected_index: !lambda |-
            return id(work_mode);
      - script.execute: apply_work_mode

switch:
  - platform: template
    id: sw_probe_heater
    name: "${lbl_probe_heater}"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lvgl.widget.update:
          id: ui_cb_probe
          state:
            checked: true
    turn_off_action:
      - lvgl.widget.update:
          id: ui_cb_probe
          state:
            checked: false

  - platform: template
    id: sw_servo_primary_enable
    name: "${lbl_servo_primary_enable}"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lvgl.widget.update:
          id: ui_sw_servo_primary
          state:
            checked: true
      - script.execute: refresh_ui_locks
    turn_off_action:
      - lvgl.widget.update:
          id: ui_sw_servo_primary
          state:
            checked: false
      - script.execute: refresh_ui_locks

  - platform: template
    id: sw_servo_secondary_enable
    name: "${lbl_servo_secondary_enable}"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lvgl.widget.update:
          id: ui_sw_servo_secondary
          state:
            checked: true
      - script.execute: refresh_ui_locks
    turn_off_action:
      - lvgl.widget.update:
          id: ui_sw_servo_secondary
          state:
            checked: false
      - script.execute: refresh_ui_locks

number:
  - platform: template
    id: num_servo_primary_position
    name: "${lbl_servo_primary_position}"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    initial_value: 25
    set_action:
      - lvgl.slider.update:
          id: ui_slider_primary
          value: !lambda return x;

  - platform: template
    id: num_servo_secondary_position
    name: "${lbl_servo_secondary_position}"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    initial_value: 40
    set_action:
      - lvgl.slider.update:
          id: ui_slider_secondary
          value: !lambda return x;

# Animate dummy readings so meters / LEDs look alive while designing.
interval:
  - interval: 2s
    then:
      - lambda: |-
          id(sim_phase)++;
          const int p = id(sim_phase);
          const float lam = 1.05f + 0.08f * sinf(p * 0.35f);
          const float o2 = 20.95f * (1.0f - 1.0f / lam);
          id(wbo_lambda).publish_state(lam);
          id(wbo_o2_pct).publish_state(o2);
          id(wbo_o2_percent).publish_state(o2);
          id(water_temp).publish_state(62.0f + 1.5f * sinf(p * 0.2f));
          id(exhaust_temp).publish_state(185.0f + 8.0f * sinf(p * 0.15f));
          id(supply_voltage).publish_state(13.4f + 0.15f * sinf(p * 0.5f));
          if (p % 6 == 0) {
            id(sim_fan_on) = !id(sim_fan_on);
            id(bin_fan).publish_state(id(sim_fan_on));
          }
          if (p % 9 == 0) {
            id(sim_bypass_closed) = !id(sim_bypass_closed);
            id(bin_bypass_closed).publish_state(id(sim_bypass_closed));
          }
          static const char *const statuses[] = {
            "${lbl_wbo_status_preheat}",
            "${lbl_wbo_status_warmup}",
            "${lbl_wbo_status_running}",
            "${lbl_wbo_status_stale}",
          };
          const char *st = statuses[p % 4];
          id(wbo_status).publish_state(st);
          id(sim_wbo_valid) = (p % 4 == 2);
          id(wbo_valid).publish_state(id(sim_wbo_valid));
